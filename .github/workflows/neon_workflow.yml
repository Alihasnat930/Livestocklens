name: Neon Branch Database

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

jobs:
  create-branch:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          parent: main

      - name: Run Migrations
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
        run: |
          npm install
          npm run db:push

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const branchUrl = '${{ steps.create-branch.outputs.branch_url }}';
            const dbUrl = '${{ steps.create-branch.outputs.db_url }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Neon Preview Branch Created**\n\n🗄️ **Branch Name:** \`preview/pr-${{ github.event.pull_request.number }}\`\n\n🔗 [View in Neon Console](${branchUrl})\n\n⚠️ This branch will be automatically deleted when the PR is closed.`
            })

  delete-branch:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🗑️ **Neon Preview Branch Deleted**\n\nThe preview database branch \`preview/pr-${{ github.event.pull_request.number }}\` has been deleted.`
            })
